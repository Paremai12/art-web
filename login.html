<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login ✨ Events</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    font-family: 'Inter', sans-serif;
    display: flex;
    align-items: center;
    position: relative;
    overflow-x: hidden;
}

/* Animated background bubbles */
.bubble {
    position: absolute;
    background: rgba(255, 255, 255, 0.1);
    border-radius: 50%;
    pointer-events: none;
    animation: floatBubble linear infinite;
}

@keyframes floatBubble {
    0% {
        transform: translateY(100vh) scale(0);
        opacity: 0;
    }
    10% {
        opacity: 0.5;
    }
    90% {
        opacity: 0.3;
    }
    100% {
        transform: translateY(-20vh) scale(1);
        opacity: 0;
    }
}

.auth-card {
    max-width: 450px;
    margin: auto;
    border-radius: 32px;
    background: rgba(255, 255, 255, 0.98);
    backdrop-filter: blur(10px);
    box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
    border: 1px solid rgba(255, 255, 255, 0.3);
    transition: transform 0.3s ease, box-shadow 0.3s ease;
}

.auth-card:hover {
    transform: translateY(-5px);
    box-shadow: 0 30px 60px -12px rgba(0, 0, 0, 0.3);
}

.auth-title {
    font-weight: 700;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    font-size: 1.75rem;
}

.form-floating > .form-control,
.form-floating > .form-select {
    height: calc(3.5rem + 2px);
    border-radius: 16px;
    border: 2px solid #e9ecef;
    transition: all 0.3s ease;
}

.form-floating > .form-control:focus,
.form-floating > .form-select:focus {
    border-color: #764ba2;
    box-shadow: 0 0 0 4px rgba(118, 75, 162, 0.1);
}

.form-floating > label {
    padding: 1rem 1rem;
    color: #6c757d;
}

.btn-purple {
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    color: white;
    border-radius: 16px;
    padding: 12px;
    font-weight: 600;
    font-size: 1rem;
    border: none;
    transition: all 0.3s ease;
    position: relative;
    overflow: hidden;
}

.btn-purple:hover {
    transform: translateY(-2px);
    box-shadow: 0 10px 20px rgba(118, 75, 162, 0.3);
}

.btn-purple:active {
    transform: translateY(0);
}

.btn-purple::before {
    content: '';
    position: absolute;
    top: 50%;
    left: 50%;
    width: 0;
    height: 0;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.3);
    transform: translate(-50%, -50%);
    transition: width 0.6s, height 0.6s;
}

.btn-purple:active::before {
    width: 300px;
    height: 300px;
}

.auth-link {
    color: #764ba2;
    text-decoration: none;
    font-weight: 500;
    transition: all 0.3s ease;
}

.auth-link:hover {
    color: #667eea;
    text-decoration: underline;
}

/* Floating shapes */
.shape {
    position: absolute;
    filter: blur(60px);
    opacity: 0.3;
    border-radius: 50%;
}

.shape-1 {
    top: -100px;
    left: -100px;
    width: 300px;
    height: 300px;
    background: linear-gradient(135deg, #667eea, #764ba2);
    animation: float 20s ease-in-out infinite;
}

.shape-2 {
    bottom: -100px;
    right: -100px;
    width: 400px;
    height: 400px;
    background: linear-gradient(135deg, #f093fb, #f5576c);
    animation: float 15s ease-in-out infinite reverse;
}

@keyframes float {
    0%, 100% { transform: translate(0, 0) rotate(0deg); }
    33% { transform: translate(30px, -30px) rotate(120deg); }
    66% { transform: translate(-20px, 20px) rotate(240deg); }
}
</style>
</head>
<body>

<div class="shape shape-1"></div>
<div class="shape shape-2"></div>

<div class="container">
    <div class="card auth-card p-4 p-md-5">
        <div class="text-center mb-4">
            <div style="font-size: 3rem;">✨</div>
            <h4 class="auth-title mt-2">Welcome Back!</h4>
            <p class="text-muted">Sign in to continue your journey</p>
        </div>

        <form id="loginForm">
            <div class="form-floating mb-3">
                <input type="text" class="form-control" id="ig" placeholder="Instagram OC" required>
                <label>📸 Instagram OC</label>
            </div>

            <div class="form-floating mb-4">
                <input type="password" class="form-control" id="pw" placeholder="Password" required>
                <label>🔒 Password</label>
            </div>

            <button class="btn btn-purple w-100 py-3" type="submit">
                Sign In ✨
            </button>
        </form>

        <div class="text-center mt-4">
            <p class="text-muted mb-0">Don't have an account? <a href="register.html" class="auth-link">Create Account</a></p>
        </div>
    </div>
</div>

<script>
// Create floating bubbles
function createBubbles() {
    const bubbleCount = 20;
    for (let i = 0; i < bubbleCount; i++) {
        const bubble = document.createElement('div');
        bubble.classList.add('bubble');
        const size = Math.random() * 60 + 20;
        bubble.style.width = size + 'px';
        bubble.style.height = size + 'px';
        bubble.style.left = Math.random() * 100 + '%';
        bubble.style.animationDuration = Math.random() * 10 + 5 + 's';
        bubble.style.animationDelay = Math.random() * 5 + 's';
        document.body.appendChild(bubble);
    }
}
createBubbles();

document.getElementById("loginForm").addEventListener("submit", async function(e){
    e.preventDefault();
    
    const ig = document.getElementById("ig");
    const pw = document.getElementById("pw");
    
    // Loading effect on button
    const btn = this.querySelector('button');
    const originalText = btn.innerHTML;
    btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span> Signing in...';
    btn.disabled = true;
    
    try {
        const res = await fetch("/login", {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify({
                ig: ig.value,
                password: pw.value
            })
        });
        
        const data = await res.json();
        
        if (data.success) {
            localStorage.setItem("currentUser", JSON.stringify(data.user));
            
            // Add success animation
            btn.style.background = "linear-gradient(135deg, #10b981, #059669)";
            btn.innerHTML = "✓ Success!";
            
            setTimeout(() => {
                if (data.user.isAdmin) {
                    window.location.href = "admin.html";
                } else {
                    window.location.href = "home.html";
                }
            }, 500);
        } else {
            btn.innerHTML = originalText;
            btn.disabled = false;
            
            // Shake animation
            const card = document.querySelector('.auth-card');
            card.style.animation = 'shake 0.5s ease-in-out';
            setTimeout(() => {
                card.style.animation = '';
            }, 500);
            
            alert("❌ Invalid Instagram or Password. Please try again.");
        }
    } catch (error) {
        btn.innerHTML = originalText;
        btn.disabled = false;
        alert("❌ Connection error. Please try again.");
    }
});

// Add shake animation
const style = document.createElement('style');
style.textContent = `
    @keyframes shake {
        0%, 100% { transform: translateX(0); }
        10%, 30%, 50%, 70%, 90% { transform: translateX(-5px); }
        20%, 40%, 60%, 80% { transform: translateX(5px); }
    }
`;
document.head.appendChild(style);
</script>
</body>
</html>
