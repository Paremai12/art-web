<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<title>Admin Panel 💜 Events Leaderboard</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
    padding: 2rem;
    position: relative;
}

/* Animated background */
.orb {
    position: absolute;
    border-radius: 50%;
    filter: blur(80px);
    opacity: 0.3;
    animation: floatOrb 20s ease-in-out infinite;
}

.orb-1 {
    top: -150px;
    left: -150px;
    width: 400px;
    height: 400px;
    background: radial-gradient(circle, #f093fb, #f5576c);
}

.orb-2 {
    bottom: -150px;
    right: -150px;
    width: 500px;
    height: 500px;
    background: radial-gradient(circle, #4facfe, #00f2fe);
    animation-delay: -5s;
}

.orb-3 {
    top: 50%;
    left: 50%;
    width: 300px;
    height: 300px;
    background: radial-gradient(circle, #43e97b, #38f9d7);
    animation-delay: -10s;
    transform: translate(-50%, -50%);
}

@keyframes floatOrb {
    0%, 100% { transform: translate(0, 0) scale(1); }
    33% { transform: translate(30px, -30px) scale(1.1); }
    66% { transform: translate(-20px, 20px) scale(0.9); }
}

.admin-card {
    position: relative;
    z-index: 1;
    max-width: 1400px;
    margin: 0 auto;
    border-radius: 32px;
    background: rgba(255, 255, 255, 0.95);
    backdrop-filter: blur(10px);
    box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
    overflow: hidden;
}

.card-header {
    background: linear-gradient(135deg, #667eea, #764ba2);
    padding: 2rem;
    color: white;
}

.table-container {
    padding: 2rem;
    overflow-x: auto;
}

.table {
    margin-bottom: 0;
    border-radius: 16px;
    overflow: hidden;
}

.table thead th {
    background: linear-gradient(135deg, #667eea, #764ba2);
    color: white;
    font-weight: 600;
    padding: 1rem;
    border: none;
    font-size: 0.9rem;
    text-transform: uppercase;
    letter-spacing: 0.5px;
}

.table tbody tr {
    transition: all 0.3s ease;
    border-bottom: 1px solid #f0f0f0;
}

.table tbody tr:hover {
    background: linear-gradient(90deg, rgba(102, 126, 234, 0.05), rgba(118, 75, 162, 0.05));
    transform: scale(1.01);
}

.table tbody td {
    padding: 1rem;
    vertical-align: middle;
    font-weight: 500;
}

.rank-badge {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 40px;
    height: 40px;
    border-radius: 50%;
    font-weight: bold;
    font-size: 1.2rem;
}

.rank-1 { 
    background: linear-gradient(135deg, #ffd700, #ffed4e);
    color: #856404;
    box-shadow: 0 4px 10px rgba(255, 215, 0, 0.3);
}
.rank-2 { 
    background: linear-gradient(135deg, #c0c0c0, #e8e8e8);
    color: #5a5a5a;
    box-shadow: 0 4px 10px rgba(192, 192, 192, 0.3);
}
.rank-3 { 
    background: linear-gradient(135deg, #cd7f32, #e8a962);
    color: #5a3a1a;
    box-shadow: 0 4px 10px rgba(205, 127, 50, 0.3);
}

.score-badge {
    display: inline-block;
    padding: 6px 16px;
    background: linear-gradient(135deg, #667eea, #764ba2);
    color: white;
    border-radius: 20px;
    font-weight: 600;
    font-size: 1rem;
}

.btn-logout {
    background: linear-gradient(135deg, #ef4444, #dc2626);
    color: white;
    border: none;
    border-radius: 12px;
    padding: 10px 24px;
    font-weight: 600;
    transition: all 0.3s ease;
}

.btn-logout:hover {
    transform: translateY(-2px);
    box-shadow: 0 10px 20px rgba(239, 68, 68, 0.3);
}

.refresh-indicator {
    position: fixed;
    bottom: 20px;
    right: 20px;
    background: rgba(255, 255, 255, 0.9);
    padding: 8px 16px;
    border-radius: 20px;
    font-size: 0.8rem;
    color: #764ba2;
    font-weight: 500;
    backdrop-filter: blur(10px);
    z-index: 10;
}

.faculty-badge {
    display: inline-block;
    padding: 4px 12px;
    background: #f3f4f6;
    border-radius: 12px;
    font-size: 0.8rem;
    color: #4b5563;
}
</style>
</head>
<body>

<div class="orb orb-1"></div>
<div class="orb orb-2"></div>
<div class="orb orb-3"></div>

<div class="container">
    <div class="admin-card">
        <div class="card-header">
            <div class="d-flex justify-content-between align-items-center flex-wrap gap-3">
                <div>
                    <h2 class="mb-1" style="font-weight: 700;">
                        <i class="fas fa-crown me-2"></i>Admin Leaderboard
                    </h2>
                    <p class="mb-0 opacity-75">Real-time ranking of all players</p>
                </div>
                <button class="btn-logout" onclick="logout()">
                    <i class="fas fa-sign-out-alt me-2"></i>Logout
                </button>
            </div>
        </div>
        
        <div class="table-container">
            <div class="table-responsive">
                <table class="table">
                    <thead>
                        <tr>
                            <th><i class="fas fa-trophy me-1"></i> Rank</th>
                            <th><i class="fas fa-user me-1"></i> Name</th>
                            <th><i class="fab fa-instagram me-1"></i> Instagram</th>
                            <th><i class="fas fa-lock me-1"></i> Password</th>
                            <th><i class="fas fa-university me-1"></i> Faculty</th>
                            <th><i class="fas fa-calendar me-1"></i> Year</th>
                            <th><i class="fas fa-star me-1"></i> Best Score</th>
                        </tr>
                    </thead>
                    <tbody id="userTable">
                        <tr>
                            <td colspan="7" class="text-center py-5">
                                <div class="spinner-border text-purple" role="status">
                                    <span class="visually-hidden">Loading...</span>
                                </div>
                                <p class="mt-2 text-muted">Loading leaderboard...</p>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<div class="refresh-indicator">
    <i class="fas fa-sync-alt me-1"></i>
    <span>Auto-refresh: 1s</span>
</div>

<script>
const user = JSON.parse(localStorage.getItem("currentUser"));

// Admin guard
if (!user || !user.isAdmin) {
    location.href = "login.html";
}

async function loadUsers() {
    try {
        const res = await fetch("/users");
        const data = await res.json();
        
        const table = document.getElementById("userTable");
        
        if (!data || data.length === 0) {
            table.innerHTML = `
                <tr>
                    <td colspan="7" class="text-center py-5">
                        <i class="fas fa-users fa-2x text-muted mb-2 d-block"></i>
                        <p class="text-muted">No users registered yet</p>
                    </td>
                </tr>
            `;
            return;
        }
        
        let rank = 1;
        
        const sortedUsers = [...data].sort((a, b) => (b.bestScore || 0) - (a.bestScore || 0));
        
        table.innerHTML = sortedUsers.map(u => {
            let rankClass = "";
            let rankIcon = "";
            
            if (rank === 1) {
                rankClass = "rank-1";
                rankIcon = "👑";
            } else if (rank === 2) {
                rankClass = "rank-2";
                rankIcon = "🥈";
            } else if (rank === 3) {
                rankClass = "rank-3";
                rankIcon = "🥉";
            } else {
                rankIcon = `#${rank}`;
            }
            
            const row = `
                <tr>
                    <td>
                        <div class="rank-badge ${rankClass}">
                            ${rank <= 3 ? rankIcon : rankIcon}
                        </div>
                    </td>
                    <td><strong>${escapeHtml(u.name || '-')}</strong></td>
                    <td><i class="fab fa-instagram me-1" style="color: #e4405f;"></i> ${escapeHtml(u.ig)}</td>
                    <td><code style="background: #f3f4f6; padding: 4px 8px; border-radius: 8px;">••••••••</code></td>
                    <td><span class="faculty-badge">${escapeHtml(u.faculty || '-')}</span></td>
                    <td>${escapeHtml(u.year || '-')}</td>
                    <td><span class="score-badge">${u.bestScore || 0}</span></td>
                </tr>
            `;
            
            rank++;
            return row;
        }).join('');
        
    } catch (error) {
        console.error("Error loading users:", error);
        document.getElementById("userTable").innerHTML = `
            <tr>
                <td colspan="7" class="text-center py-5 text-danger">
                    <i class="fas fa-exclamation-triangle fa-2x mb-2 d-block"></i>
                    Error loading data. Please refresh.
                </td>
            </tr>
        `;
    }
}

function escapeHtml(text) {
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
}

// Auto-refresh every second
setInterval(loadUsers, 1000);
loadUsers();

function logout() {
    localStorage.removeItem("currentUser");
    location.href = "login.html";
}
</script>
</body>
</html>
